name: dependabot-copy

# Copies each Dependabot PR into a PR opened by starl3xx, and keeps the copy in
# step with Dependabot's pushes.
#
# Two things fail on a Dependabot PR and neither is about the code. Bugbot runs
# on a personal Cursor plan that reviews only PRs whose author is the linked
# GitHub account, and answers anything else with "GitHub account mismatch". And
# a PR Dependabot opens gets no repository secrets, so `published-figures`
# fails on it for no reason. A PR opened with starl3xx's token fixes both.
#
# The token is DEPENDABOT_COPY_TOKEN: a fine-grained token for starl3xx on this
# repository only, with Contents, Pull requests and Workflows set to read and
# write (the monthly github-actions updates change files under
# .github/workflows, which no push may do without Workflows). It is stored in
# BOTH secret stores: a run that Dependabot starts can read only Dependabot
# secrets, and a run anyone else starts reads only Actions secrets. It expires
# a year after 2026-09-24; Linear STA-42 is the reminder.
#
# The Dependabot PR is left open on purpose. Dependabot keeps rebasing an open
# PR, each push reaches this workflow as `synchronize`, and the copy branch is
# moved to the same commit, so the copy never needs a hand rebase. Merge the
# copy; Dependabot then sees the update on main and closes its own PR.
#
# Nothing here checks out or runs the PR's code: every step is a GitHub API
# call on refs and PRs, so a hostile dependency cannot reach the token. That is
# what makes `pull_request_target` safe here, and it is used because
# `pull_request` runs nothing at all on a PR GitHub cannot merge, `closed`
# included: a conflicting Dependabot PR that Dependabot then closed would have
# left its copy open. The daily run is the backstop for any event missed
# anyway: it closes every copy whose Dependabot PR was closed unmerged.

on:
  pull_request_target:
    # `labeled` because Dependabot adds its labels in a second request after
    # `opened`, and the copy has to pick them up whenever they arrive.
    types: [opened, synchronize, reopened, labeled, closed]
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: Number of the Dependabot PR to copy
        required: true

permissions:
  contents: read

concurrency:
  group: dependabot-copy-${{ github.event.pull_request.number || inputs.pr || 'sweep' }}
  cancel-in-progress: false

jobs:
  sweep:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.DEPENDABOT_COPY_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Close copies whose Dependabot PR is no longer open
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::DEPENDABOT_COPY_TOKEN is missing from the Actions secret store (Linear STA-33)."
            exit 1
          fi
          gh pr list --repo "$REPO" --state open --limit 200 \
            --json number,headRefName \
            -q '.[] | select(.headRefName | startswith("deps/copy/")) | "\(.number) \(.headRefName)"' |
          while read -r copy_number copy_branch; do
            original="${copy_branch#deps/copy/}"
            state=$(gh pr list --repo "$REPO" --head "$original" --state all \
              --json state -q '.[0].state // "MISSING"')
            if [ "$state" != "OPEN" ]; then
              gh pr close "$copy_number" --repo "$REPO" --delete-branch \
                --comment "The Dependabot PR this copied is no longer open ($state), so this copy is closed too."
              echo "Closed copy #$copy_number ($state)."
            fi
          done

  copy:
    # Only a PR Dependabot opened. The copy itself is opened by starl3xx, so
    # its own events never re-enter here.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.DEPENDABOT_COPY_TOKEN }}
      REPO: ${{ github.repository }}
      NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
      EVENT_ACTION: ${{ github.event.action }}
    steps:
      - name: Copy or follow the Dependabot PR
        run: |
          set -euo pipefail

          if [ -z "$GH_TOKEN" ]; then
            echo "::error::DEPENDABOT_COPY_TOKEN is missing from this run's secret store. It must be in both the Dependabot and the Actions stores (Linear STA-33)."
            exit 1
          fi

          pr=$(gh api "repos/$REPO/pulls/$NUMBER")
          author=$(jq -r '.user.login' <<<"$pr")
          head=$(jq -r '.head.ref' <<<"$pr")
          sha=$(jq -r '.head.sha' <<<"$pr")
          state=$(jq -r '.state' <<<"$pr")
          merged=$(jq -r '.merged' <<<"$pr")
          same_repo=$(jq -r '.head.repo.full_name == .base.repo.full_name' <<<"$pr")

          if [ "$author" != "dependabot[bot]" ] || [ "$same_repo" != "true" ]; then
            echo "::error::#$NUMBER is not a Dependabot PR from this repository (author $author). Nothing copied."
            exit 1
          fi

          copy="deps/copy/$head"
          existing=$(gh pr list --repo "$REPO" --head "$copy" --state open \
            --json number -q '.[0].number // empty')

          if [ "$state" = "closed" ]; then
            # Merged: nothing to do. Closed unmerged means Dependabot gave up
            # on it (superseded, or the update is no longer wanted), and the
            # copy goes with it. A copy already merged is not "open" here.
            if [ "$merged" != "true" ] && [ -n "$existing" ]; then
              gh pr close "$existing" --repo "$REPO" --delete-branch \
                --comment "Dependabot closed #$NUMBER without merging it, so this copy is closed too."
            fi
            exit 0
          fi

          # A copy already merged means the update is on main, and Dependabot
          # closes its own PR once it sees that. A push it makes first (a rebase
          # onto the new main) must not open a second copy.
          merged_copy=$(gh pr list --repo "$REPO" --head "$copy" --state merged \
            --json number -q '.[0].number // empty')
          if [ -n "$merged_copy" ]; then
            echo "Copy #$merged_copy already merged; Dependabot closes #$NUMBER on its own."
            exit 0
          fi

          # Point the copy branch at Dependabot's head commit: create it the
          # first time, and move it (force) when Dependabot pushes. It is never
          # moved over a commit somebody added to the copy, such as a changelog
          # entry: a force move would discard it. Only commits Dependabot
          # authored may be replaced, which covers its own rebases.
          if copy_head=$(gh api "repos/$REPO/git/ref/heads/$copy" -q .object.sha 2>/dev/null); then
            if [ "$copy_head" = "$sha" ]; then
              echo "$copy is already at $sha."
            else
              own=$(gh api "repos/$REPO/compare/$sha...$copy_head" \
                -q '[.commits[] | select((.author.login // "") != "dependabot[bot]")] | length')
              if [ "$own" = "0" ]; then
                gh api -X PATCH "repos/$REPO/git/refs/heads/$copy" \
                  -f sha="$sha" -F force=true >/dev/null
                echo "Moved $copy to $sha."
              else
                echo "::warning::$copy has $own commit(s) of its own, so it was not moved to $sha."
                if [ "$EVENT_ACTION" = "synchronize" ] && [ -n "$existing" ]; then
                  gh pr comment "$existing" --repo "$REPO" \
                    --body "Dependabot updated #$NUMBER to $sha, but this branch has $own commit(s) of its own, so the workflow did not move it. Rebase it onto $sha by hand, then the workflow follows Dependabot again."
                fi
              fi
            fi
          else
            gh api "repos/$REPO/git/refs" \
              -f ref="refs/heads/$copy" -f sha="$sha" >/dev/null
            echo "Created $copy at $sha."
          fi

          created=""
          if [ -n "$existing" ]; then
            copy_number="$existing"
            echo "Copy #$existing follows #$NUMBER."
          else
            title=$(jq -r '.title' <<<"$pr")
            body=$(printf '%s\n\n%s\n\n%s\n' \
              "Copy of #$NUMBER, opened by starl3xx so Bugbot reviews it and CI gets the repository secrets. Made by the dependabot-copy workflow." \
              "The Dependabot PR stays open so Dependabot keeps it rebased; this branch follows its pushes. Merge this one, and Dependabot then closes #$NUMBER on its own." \
              "---" )
            body="$body$(jq -r '(.body // "")[0:60000]' <<<"$pr")"
            url=$(gh pr create --repo "$REPO" --base "$(jq -r '.base.ref' <<<"$pr")" \
              --head "$copy" --title "$title" --body "$body")
            echo "Opened $url."
            copy_number="${url##*/}"
            created="$url"
          fi

          # Carry Dependabot's labels over (no-docs-needed among them), so the
          # copy is judged by the same gates the original would have been. On
          # every run, not only at creation: Dependabot labels its PR after
          # opening it, so the labels usually arrive on a later `labeled` run.
          # Adding a label the copy already has changes nothing. Through the
          # labels endpoint itself: `gh pr edit` also reads project fields,
          # which this token cannot, and so it never applied a label.
          jq -r '.labels[].name' <<<"$pr" | while read -r label; do
            if [ -n "$label" ]; then
              gh api --method POST "repos/$REPO/issues/$copy_number/labels" \
                -f "labels[]=$label" >/dev/null
            fi
          done

          if [ -n "$created" ]; then
            gh pr comment "$NUMBER" --repo "$REPO" \
              --body "Copied to $created so Bugbot can review it. Merge the copy; this PR closes on its own once the update is on main."
          fi
