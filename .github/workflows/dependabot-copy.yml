name: dependabot-copy

# Copies each Dependabot PR into a PR opened by starl3xx, and keeps the copy in
# step with Dependabot's pushes.
#
# Two things fail on a Dependabot PR and neither is about the code. Bugbot runs
# on a personal Cursor plan that reviews only PRs whose author is the linked
# GitHub account, and answers anything else with "GitHub account mismatch". And
# a PR Dependabot opens gets no repository secrets, so `published-figures`
# fails on it for no reason. A PR opened with starl3xx's token fixes both.
#
# The token is DEPENDABOT_COPY_TOKEN: a fine-grained token for starl3xx on this
# repository only, with Contents, Pull requests and Workflows set to read and
# write (the monthly github-actions updates change files under
# .github/workflows, which no push may do without Workflows). It is stored in
# BOTH secret stores: a run that Dependabot starts can read only Dependabot
# secrets, and a run anyone else starts reads only Actions secrets. It expires
# a year after 2026-09-24; Linear STA-42 is the reminder.
#
# The Dependabot PR is left open on purpose. Dependabot keeps rebasing an open
# PR, each push reaches this workflow as `synchronize`, and the copy branch is
# moved to the same commit, so the copy never needs a hand rebase. Merge the
# copy; Dependabot then sees the update on main and closes its own PR.
#
# Nothing here checks out or runs the PR's code. The only checkout is the
# default branch, for .github/scripts/dependabot-copy.sh, and every step is a
# GitHub API call on refs and PRs, so a hostile dependency cannot reach the
# token. That is what makes `pull_request_target` safe here, and it is used
# because `pull_request` runs nothing at all on a PR GitHub cannot merge,
# `closed` included: a conflicting Dependabot PR that Dependabot then closed
# would have left its copy open.
#
# The daily run is the backstop, and it does not depend on the event runs: it
# closes every copy whose Dependabot PR was closed unmerged, then copies or
# updates every open Dependabot PR. GitHub's docs do not settle whether a
# pull_request_target run that Dependabot starts gets the token; if one does
# not, it warns and the daily run does the work.

on:
  pull_request_target:
    # `labeled` because Dependabot adds its labels in a second request after
    # `opened`, and the copy has to pick them up whenever they arrive.
    types: [opened, synchronize, reopened, labeled, closed]
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: Number of the Dependabot PR to copy
        required: true

permissions:
  contents: read

concurrency:
  group: dependabot-copy-${{ github.event.pull_request.number || inputs.pr || 'sweep' }}
  cancel-in-progress: false

jobs:
  sweep:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.DEPENDABOT_COPY_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Close copies whose Dependabot PR was closed unmerged
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::DEPENDABOT_COPY_TOKEN is missing from the Actions secret store (Linear STA-33)."
            exit 1
          fi
          gh pr list --repo "$REPO" --state open --limit 200 \
            --json number,headRefName \
            -q '.[] | select(.headRefName | startswith("deps/copy/")) | "\(.number) \(.headRefName)"' |
          while read -r copy_number copy_branch; do
            original="${copy_branch#deps/copy/}"
            state=$(gh pr list --repo "$REPO" --head "$original" --state all \
              --json state -q '.[0].state // "MISSING"')
            # Only CLOSED, which is closed unmerged: Dependabot gave up on the
            # update, so the copy goes too, as the `closed` handler does. A
            # MERGED original (merged by hand instead of the copy) and a
            # MISSING one are left for a person, because closing would also
            # delete the copy branch and any commit added to it.
            if [ "$state" = "CLOSED" ]; then
              gh pr close "$copy_number" --repo "$REPO" --delete-branch \
                --comment "Dependabot closed the PR this copied without merging it, so this copy is closed too."
              echo "Closed copy #$copy_number."
            elif [ "$state" != "OPEN" ]; then
              echo "::warning::Copy #$copy_number: its Dependabot PR is $state. Left open for a person to decide."
            fi
          done

      - name: Copy or update every open Dependabot PR
        run: |
          set -euo pipefail
          gh pr list --repo "$REPO" --state open --limit 200 \
            --json number,author \
            -q '.[] | select(.author.login == "app/dependabot" or .author.login == "dependabot[bot]") | .number' |
          while read -r n; do
            NUMBER="$n" EVENT_ACTION="" .github/scripts/dependabot-copy.sh || \
              echo "::warning::Could not copy #$n; the next sweep tries again."
          done

  copy:
    # Only a PR Dependabot opened. The copy itself is opened by starl3xx, so
    # its own events never re-enter here.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.DEPENDABOT_COPY_TOKEN }}
      REPO: ${{ github.repository }}
      NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
      EVENT_ACTION: ${{ github.event.action }}
    steps:
      # The default branch, never the PR: a pull_request_target run checks out
      # the base by default, and nothing below reads the PR's files.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Copy or follow the Dependabot PR
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            if [ "${{ github.event_name }}" = "pull_request_target" ]; then
              # Whether a Dependabot-started pull_request_target run gets the
              # token is not settled by GitHub's docs, so this run does not
              # depend on it: the daily sweep copies every open Dependabot PR.
              echo "::warning::DEPENDABOT_COPY_TOKEN is not available to this run. The daily sweep will copy #$NUMBER."
              exit 0
            fi
            echo "::error::DEPENDABOT_COPY_TOKEN is missing from the Actions secret store (Linear STA-33)."
            exit 1
          fi
          .github/scripts/dependabot-copy.sh
