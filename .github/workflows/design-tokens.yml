name: design-tokens

# Fails a PR that reintroduces a raw Tailwind palette class.
#
# There is an ESLint rule for this too, and it is the one that gives feedback in
# the editor. This exists because `npm run lint` currently reports nine
# unrelated pre-existing errors, so it cannot be a required check without fixing
# those first, and a guard that never runs is not a guard.
#
# Grepping is also honest about what it is: the sweep removed 471 of these, and
# the only failure mode worth blocking is a new one appearing.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'app/**'
      - 'components/**'
      # lib/ was missing, and that was the hole. lib/og-fonts.ts holds the share
      # card palette and lib/email.ts the only HTML email, both of which write
      # literal colours because Satori and email clients cannot read a CSS
      # custom property. A PR touching only those files did not start this job
      # at all, so the drift there was invisible twice over.
      - 'lib/**'
      - 'eslint.config.mjs'
      - 'scripts/check-palette-guard.mjs'
      - 'scripts/check-design-language.mjs'
      - 'scripts/check-contrast.mjs'
      - 'scripts/check-og-palette.mjs'
      - 'scripts/check-control-height.mjs'
      # The browser guard reads --height-control out of this file, and a change
      # to the token is exactly when a rendered height needs re-measuring.
      - 'app/globals.css'
      - 'scripts/lib/**'
      - '.github/workflows/design-tokens.yml'

jobs:
  palette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Runs first on purpose. A guard verified only against code that already
      # passes proves nothing; this feeds it known violations it must catch and
      # valid tokens it must not flag.
      - name: The guard catches what it claims to
        run: node scripts/check-palette-guard.mjs

      - name: No raw Tailwind palette classes
        run: |
          set -uo pipefail

          # All 22 shaded families. The neutrals were missing until now, and the
          # check reported clean over 18 live violations because of it.
          FAMILIES='red|orange|amber|yellow|lime|green|emerald|teal|cyan|sky|blue|indigo|violet|purple|fuchsia|pink|rose|slate|gray|zinc|neutral|stone'

          # Not an allowlist of utility prefixes. That version missed
          # `hover:text-green-500` (the variant occupies the leading slot) and
          # `prose-blockquote:border-l-emerald-500` (directional suffix, prefix
          # not on the list) — the second of which was live in the blog page
          # while this check reported clean.
          #
          # Match the family and shade after any hyphen, through any variant
          # chain. No semantic token contains a palette family name, so
          # accent-brand / attested / caution / destructive cannot trip it.
          PATTERN="(^|[\"' \`])([a-z0-9-]+:)*[a-z-]*-(${FAMILIES})-[0-9]{2,3}"

          HITS=$(grep -rnE "$PATTERN" app components --include='*.tsx' --include='*.ts' 2>/dev/null || true)

          if [ -z "$HITS" ]; then
            echo "No raw palette classes. Colour still comes from tokens."
            exit 0
          fi

          echo "$HITS"
          echo
          echo "::error::Raw Tailwind palette classes found. Use a semantic token: accent-brand (brand and interactive), attested (a measured fact), caution (limits, staleness), destructive (removal), or muted. See app/globals.css and CLAUDE.md."
          exit 1

  og-palette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Satori and HTML email render outside the CSS cascade, so they cannot use
      # var(--token) and must write literals. This checks that each literal is
      # still a token's value, converting from globals.css at run time rather
      # than against a copied table. Deliberate non-token values are listed in
      # the script by value with a rendering reason.
      - name: Share cards and email still use token values
        run: node scripts/check-og-palette.mjs

  design-language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Radius, elevation, arbitrary type sizes and the uppercase label. Fixtures
      # run first inside the script, so a guard that has stopped working fails
      # before it can report a clean codebase.
      #
      # It deliberately does not try to answer whether a value is the RIGHT token
      # for its size, whether two components share a class name, or whether the
      # page renders. A grep cannot see any of those, and pretending otherwise is
      # how the palette guard came to report zero over eighteen live violations.
      - name: Design language holds
        run: node scripts/check-design-language.mjs

  contrast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The other two guards ask whether a value is on-system. Neither can ask
      # whether a person can see it, and that question has a number for an
      # answer, so it belongs here rather than in review.
      #
      # It reads the tokens out of globals.css, so it cannot drift from what
      # ships, and it validates its own OKLCH-to-sRGB conversion against hex
      # values measured in Chrome before trusting a single ratio. A colour-space
      # implementation that is subtly wrong produces entirely plausible numbers.
      #
      # Decorative separation is exempt from WCAG 1.4.11 and is deliberately not
      # checked: card and table hairlines stay quiet on purpose. Only what is
      # needed to identify a control has to clear 3:1.
      - name: Both themes meet WCAG AA
        run: node scripts/check-contrast.mjs

  control-height:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The only design job that installs anything, because it is the only one
      # that runs the app. The other three read source and stylesheets.
      - run: npm ci

      # The guard that opens a browser, and the only one that can answer "what
      # height did this actually render at".
      #
      # It exists because on 2026-08-23 a Button carrying `h-control` was given
      # `flex-1` inside a `flex-col` row, so a flex basis replaced its height and
      # it rendered 22px on every phone and 34px from `sm` up. Every class was
      # on-system, all twelve rules in check-design-language.mjs passed over it,
      # ESLint was quiet and the build was green. The defect shipped.
      #
      # No browser is installed: the runner image already carries Google Chrome,
      # and the script drives it over the DevTools protocol through Node's own
      # WebSocket. It starts `next dev` with DATABASE_URL blank, so this needs no
      # secrets; the pages it measures all render without one.
      #
      # Like the other guards it runs fixtures first, and its fixture is the
      # 2026-08-23 bug itself. A browser guard has more ways to succeed silently
      # than a grep does: a detached Chrome, a selector matching nothing or a
      # settle that fires before the font loads all produce an empty violation
      # list, which reads exactly like a healthy page.
      - name: Every control renders at the height it declares
        run: node scripts/check-control-height.mjs
