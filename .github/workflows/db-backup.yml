# Nightly encrypted backup of the irreplaceable tables (users, api_keys,
# whitelist, lookup_history, known_agents, api_plans). The Farcaster/ENS/
# holdings data is rebuildable from source; customer/business data is not.
#
# Encryption uses age with a PUBLIC recipient key — the private key never
# touches the runner, so a compromised runner cannot read past backups.
#
# Required repository secrets (the runbook that says where each is kept lives in
# the private starl3xx/walletlink-ops repo, NOT in this one):
#   BACKUP_DATABASE_URL     — the read-only backup_reader connection string
#   BACKUP_AGE_PUBLIC_KEY   — an age recipient public key (age1...)
#
# Restore:  age -d -i <your-private-key> backup-YYYY-MM-DD.sql.age > restore.sql
name: db-backup

on:
  schedule:
    - cron: '0 8 * * *' # 08:00 UTC daily
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Guard — required secrets present
        env:
          DB: ${{ secrets.BACKUP_DATABASE_URL }}
          AGE_PUB: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
        run: |
          if [ -z "$DB" ] || [ -z "$AGE_PUB" ]; then
            echo "BACKUP_DATABASE_URL and BACKUP_AGE_PUBLIC_KEY must be set — see the runbook in starl3xx/walletlink-ops" >&2
            exit 1
          fi

      # Neon runs PostgreSQL 17. pg_dump refuses to dump a server newer than
      # itself ("aborting because of server version mismatch"), and Ubuntu's
      # default `postgresql-client` is 16 — which would have made every nightly
      # run fail. Pull the matching major from PGDG instead.
      - name: Install pg_dump 17 and age
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates lsb-release age
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          # /usr/bin/pg_dump is Debian's pg_wrapper, which dispatches to a major
          # it chooses itself — the runner image already ships 16, so merely
          # installing 17 does not mean we RUN 17. Put the real v17 bin dir
          # first and let later steps use the absolute path regardless.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump irreplaceable tables and encrypt
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_AGE_PUBLIC_KEY: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          # Absolute path, not PATH lookup — see the install step. Then assert
          # the major, so a future PGDG/runner change fails loudly here instead
          # of silently reintroducing the version-mismatch abort.
          PG_DUMP=/usr/lib/postgresql/17/bin/pg_dump
          "$PG_DUMP" --version
          "$PG_DUMP" --version | grep -qE '\(PostgreSQL\) 17\.' || {
            echo "Expected pg_dump major 17, got: $("$PG_DUMP" --version)" >&2
            exit 1
          }
          STAMP="$(date -u +%Y-%m-%d)"
          OUT="backup-${STAMP}.sql.age"
          "$PG_DUMP" "$BACKUP_DATABASE_URL" \
            --no-owner --no-privileges \
            -t public.users \
            -t public.api_keys \
            -t public.api_plans \
            -t public.whitelist \
            -t public.lookup_history \
            -t public.known_agents \
            -t public.credit_lots \
            -t public.credit_ledger \
            | age -r "$BACKUP_AGE_PUBLIC_KEY" -o "$OUT"
          # A backup that "succeeds" but is empty is worse than no backup — it
          # looks green until the day you need it. The eight tables always carry
          # at least the seeded api_plans and ~13k known_agents rows, so a
          # healthy dump is far above this floor; anything under it means the
          # dump silently produced nothing.
          #
          # credit_lots and credit_ledger joined the list on 2026-08-24. They are
          # the only record of who paid and what they spent, this job's own
          # header says it captures the irreplaceable tables, and they were not
          # in it. The role needs the grant as well as the -t entry; both live in
          # scripts/migrate-grant-readonly.ts, and pg_dump fails outright if they
          # disagree, which is the failure mode worth having.
          SIZE=$(wc -c < "$OUT")
          if [ "$SIZE" -lt 10000 ]; then
            echo "Encrypted dump is only ${SIZE} bytes — refusing to publish an empty backup" >&2
            exit 1
          fi
          echo "Wrote $OUT ($(du -h "$OUT" | cut -f1))"
          echo "ARTIFACT=$OUT" >> "$GITHUB_ENV"

      - name: Upload encrypted dump
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.ARTIFACT }}
          retention-days: 90
