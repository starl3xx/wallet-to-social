# Lens account-metadata harvest: walks the social protocol's accounts by
# cursor and ingests owner-set X attributes through the shared attested-link
# ingest (source 'lens_profile'). The network's graph has been largely
# static since early 2025, so this is a backfill that finishes and then a
# monthly touch, not a daily pipeline. Checkpointed in ingest_state
# ('lens_profile_harvest'); dispatch with a bigger budget to finish the
# backfill sooner.
#
# Required repository secrets: DATABASE_URL (the ingestLinks write set,
# already granted to sweep_runner).
name: lens-profile-harvest

on:
  schedule:
    - cron: '45 5 1 * *' # the 1st, 05:45 UTC, before the morning cron train
  workflow_dispatch:
    inputs:
      max_requests:
        description: 'GraphQL request budget'
        required: false
        default: '2000'
        type: string

concurrency:
  group: lens-profile-harvest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    # 2,000 requests at a 250ms pause is under 15 minutes plus ingest time.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The input reaches the shell only through an env var, never by
      # expression interpolation inside run: — that form is shell injection
      # with secrets in scope. The script rejects a non-integer value.
      - run: npx tsx scripts/harvest-lens-profiles.ts --commit --max-requests "$MAX_REQUESTS"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MAX_REQUESTS: ${{ inputs.max_requests || '2000' }}
