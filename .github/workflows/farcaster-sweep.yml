# Monthly full Farcaster sweep: re-ingests every FID's verified wallets into
# social_graph, catching what the daily incremental cron can't — new
# verifications on existing FIDs, handle changes, follower counts, revocations.
#
# ~33k Neynar API calls ≈ 1 hour at free-tier pacing (600 RPM), ~3.3M of the
# free tier's 10M monthly credits.
#
# Required repository secrets: DATABASE_URL, NEYNAR_API_KEY
name: farcaster-full-sweep

on:
  schedule:
    - cron: '0 6 2 * *' # 06:00 UTC on the 2nd of each month
  workflow_dispatch:
    inputs:
      mode:
        description: 'Sweep mode'
        required: false
        default: '--slice'
        type: choice
        options:
          - '--slice'
          - '--auto'
          - '--full'
          - '--incremental'
          - '--resume'

# Never run two sweeps at once — a second run's revocation cleanup could
# interact badly with the first's writes
concurrency:
  group: farcaster-sweep
  cancel-in-progress: false

# Minimize the token's scope — this job only needs to read the repo. After the
# role split its DATABASE_URL secret should be sweep_runner, not the owner. That
# role is granted per table and inherits nothing on a table created later, so a
# new table needs adding to scripts/migrate-grant-readonly.ts or this job meets
# "permission denied for table <name>". The runbook naming which credential
# lives where is in the private starl3xx/walletlink-ops repo, not this one.
permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    # Measured locally: ~115 min for the full network at current pacing.
    # 350 leaves headroom for slower runners and network growth (job max 360).
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `--slice` on the schedule: one sixth of the FID space per month, so
      # every FID is re-checked twice a year and revocation cleanup runs every
      # month over the sixth it just swept.
      #
      # It replaces `--auto`, which was a workaround for a cost that turned out
      # not to be real. The reasoning was that a full sweep exhausts the
      # background ceiling and so can never complete, taken from August's
      # 11,557,744 credits against a 7,500,000 ceiling. That figure was the
      # whole month's account usage across every app, not the sweep. Measured on
      # 2026-09-01 over 912,052 FIDs, the sweep costs almost exactly one credit
      # per FID, so a full pass is about 3.35M and a monthly sixth about 558k.
      #
      # Slices are preferred anyway. A full sweep leaves eleven months of
      # staleness between passes and clears revocations once a year; a sixth
      # clears its own every month, now that cleanup is bounded to the span the
      # run actually covered. `--auto` and `--full` stay available by hand.
      - run: npx tsx scripts/farcaster-sweep.ts ${{ inputs.mode || '--slice' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEYNAR_API_KEY: ${{ secrets.NEYNAR_API_KEY }}
