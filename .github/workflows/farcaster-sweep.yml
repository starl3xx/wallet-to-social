# Monthly full Farcaster sweep: re-ingests every FID's verified wallets into
# social_graph, catching what the daily incremental cron can't — new
# verifications on existing FIDs, handle changes, follower counts, revocations.
#
# ~33k Neynar API calls ≈ 1 hour at free-tier pacing (600 RPM), ~3.3M of the
# free tier's 10M monthly credits.
#
# Required repository secrets: DATABASE_URL, NEYNAR_API_KEY
name: farcaster-full-sweep

on:
  schedule:
    - cron: '0 6 2 * *' # 06:00 UTC on the 2nd of each month
  workflow_dispatch:
    inputs:
      mode:
        description: 'Sweep mode'
        required: false
        default: '--auto'
        type: choice
        options:
          - '--auto'
          - '--full'
          - '--incremental'
          - '--resume'

# Never run two sweeps at once — a second run's revocation cleanup could
# interact badly with the first's writes
concurrency:
  group: farcaster-sweep
  cancel-in-progress: false

# Minimize the token's scope — this job only needs to read the repo. After the
# role split its DATABASE_URL secret should be sweep_runner, not the owner. That
# role is granted per table and inherits nothing on a table created later, so a
# new table needs adding to scripts/migrate-grant-readonly.ts or this job meets
# "permission denied for table <name>". The runbook naming which credential
# lives where is in the private starl3xx/walletlink-ops repo, not this one.
permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    # Measured locally: ~115 min for the full network at current pacing.
    # 350 leaves headroom for slower runners and network growth (job max 360).
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `--auto` on the schedule, not `--full`. A full sweep that exhausts the
      # Neynar background ceiling stops partway and records where; before that
      # checkpoint existed, the next month restarted at FID 1, spent its budget
      # re-covering the same ground, stopped in about the same place and left
      # another ~580 MB seen table behind. August spent 11,557,744 credits
      # against a 7,500,000 ceiling and still did not finish, so the sweep could
      # never complete and revocation cleanup could never run.
      #
      # `--auto` resumes the checkpoint if there is one and starts a fresh full
      # sweep if there is not, carrying the same seen table and the original
      # start timestamp across segments so cleanup stays valid.
      - run: npx tsx scripts/farcaster-sweep.ts ${{ inputs.mode || '--auto' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEYNAR_API_KEY: ${{ secrets.NEYNAR_API_KEY }}
