# The Farcaster half of the social pipeline: casts the queued post that is
# due as @walletlink with its on-brand card embedded. The X half is
# scheduled in Typefully and never runs here.
#
# Three posts a week since 2026-10-13, Monday, Wednesday and Friday. It was
# daily until then and kept its name, because the name is also the run
# history and the checkpoint key. The schedule below is the cadence:
# scripts/check-social-queue.ts reads its weekday field and fails a PR whose
# queue dates a post on a day this cron never runs, or skips one it does.
#
# Each post is cast once (checkpointed in ingest_state), budget-guarded like
# every other Neynar cron, warns as the queue runs low, and FAILS once the
# queue has run dry, so an empty queue shows as a red run rather than a
# green one that cast nothing. The queue lives in content/social/queue.json
# and changes by PR, so every post that will ever be cast has been through
# review.
#
# Required repository secrets: DATABASE_URL (sweep_runner; needs the
# ingest_state write the harvest grant script already gave it),
# NEYNAR_API_KEY, and NEYNAR_SIGNER_UUID (the approved managed signer for
# @walletlink; revocable in the Farcaster app if it ever leaks).
name: daily-cast

on:
  schedule:
    - cron: '35 17 * * 1,3,5' # Mon, Wed, Fri 17:35 UTC, after the X slot
  workflow_dispatch: {}

concurrency:
  group: daily-cast
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/cast-daily.ts --send
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEYNAR_API_KEY: ${{ secrets.NEYNAR_API_KEY }}
          NEYNAR_SIGNER_UUID: ${{ secrets.NEYNAR_SIGNER_UUID }}
